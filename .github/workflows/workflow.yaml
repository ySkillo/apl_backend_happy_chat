name: CI - Happy Chat Backend

# Pipeline única do backend:
#   PR           -> valida nome da branch (se for para main) + build + testes
#   push         -> build + testes + publish (artefato)
#   homologation -> cria tag vX.Y.Z-rc.N + pre-release no GitHub
#   main         -> (só PR de ReleaseDDMMAA) cria tag vX.Y.Z + release no GitHub

on:
  push:
    branches: [main, homologation, development]
  pull_request:
    branches: [main, homologation, development]
  workflow_dispatch:

# Em PR, um commit novo cancela a execução anterior.
# Em push nunca cancela: assim nenhuma tag de rc/release é perdida.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: HappyChat.sln
  API_PROJECT: src/HappyChat.API/HappyChat.API.csproj
  ARTIFACT_NAME: happychat-api-${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Só branches ReleaseDDMMAA podem ir para a main
  # ---------------------------------------------------------------------------
  check-release-branch:
    name: Só branches Release na main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar nome da branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_BRANCH" =~ ^Release[0-9]{6}$ ]]; then
            echo "::error::A branch '$HEAD_BRANCH' não pode ir para a main. Use o formato ReleaseDDMMAA (ex.: Release171026)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build, testes e publish (o publish só acontece em push)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (com cache de NuGet)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      # Ainda não há projetos de teste na solution; este passo passa a valer
      # automaticamente assim que você adicionar um (ex.: HappyChat.Tests).
      - name: Test
        run: >
          dotnet test "$SOLUTION"
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload dos resultados de teste
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: ./TestResults
          if-no-files-found: ignore
          retention-days: 7

      # Não quebra o build; apenas avisa se houver pacote NuGet vulnerável.
      - name: Verificar pacotes vulneráveis
        run: |
          dotnet list "$SOLUTION" package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::warning::Há pacotes NuGet com vulnerabilidades conhecidas. Veja o log deste passo."
          fi

      - name: Publish da API
        if: github.event_name == 'push'
        run: >
          dotnet publish "$API_PROJECT"
          --configuration Release
          --no-build
          --output ./publish

      - name: Upload do artefato
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # homologation -> tag rc + pre-release
  # ---------------------------------------------------------------------------
  tag-homologation:
    name: Tag rc (homologation)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/homologation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Serializa a criação de tags para a numeração das rcs nunca colidir.
    concurrency:
      group: tagging-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir e criar tag rc
        id: tag
        env:
          # Tipo de incremento da versão base: major, minor ou patch (padrão: minor).
          # Para mudar: Settings > Secrets and variables > Actions > Variables > RC_BUMP
          BUMP: ${{ vars.RC_BUMP || 'minor' }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          # Se este commit já tem uma tag rc, reaproveita (execução repetida).
          head_tags=$(git tag --points-at "$GITHUB_SHA")
          existing=$(grep -E -- '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' <<< "$head_tags" | sort -V | tail -n1 || true)
          if [ -n "$existing" ]; then
            echo "O commit já possui a tag $existing. Nada a criar."
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Última versão estável (vX.Y.Z, sem sufixo), criada na main.
          last_stable=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          if [ -z "$last_stable" ]; then
            base="0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${last_stable#v}"
            case "$BUMP" in
              major) base="$((major + 1)).0.0" ;;
              minor) base="${major}.$((minor + 1)).0" ;;
              patch) base="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::RC_BUMP inválido: $BUMP (use major, minor ou patch)"; exit 1 ;;
            esac
          fi

          # Próximo número de rc para essa versão base.
          last_rc=$(git tag --list "v${base}-rc.*" | sed -E 's/.*-rc\.//' | sort -n | tail -n1 || true)
          next_rc=$(( ${last_rc:-0} + 1 ))
          tag="v${base}-rc.${next_rc}"

          echo "Criando tag $tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release candidate ${next_rc} da v${base}" "$GITHUB_SHA"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish

      - name: Criar pre-release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG já existe. Nada a fazer."
            exit 0
          fi

          (cd publish && zip -qr "../happychat-api-${TAG}.zip" .)

          gh release create "$TAG" "happychat-api-${TAG}.zip" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "$TAG"

  # ---------------------------------------------------------------------------
  # main (PR de ReleaseDDMMAA) -> tag final + release
  # ---------------------------------------------------------------------------
  tag-release:
    name: Tag final (main)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: tagging-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir e criar tag final
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          # Descobre o PR que gerou este commit na main.
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                 --jq '[.[] | select(.base.ref == "main")][0] // empty')

          if [ -z "$pr" ]; then
            echo "Commit sem Pull Request associado. Nada a fazer."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_branch=$(jq -r '.head.ref' <<< "$pr")

          # Só branches ReleaseDDMMAA geram tag final.
          if [[ ! "$head_branch" =~ ^Release[0-9]{6}$ ]]; then
            echo "Branch '$head_branch' não é uma Release. Nada a fazer."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Se este commit já tem tag final, reaproveita (execução repetida).
          head_tags=$(git tag --points-at "$GITHUB_SHA")
          existing=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$head_tags" | sort -V | tail -n1 || true)
          if [ -n "$existing" ]; then
            echo "O commit já possui a tag $existing. Nada a criar."
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Versão final = versão base das rcs que ainda não têm tag final
          # (ex.: existe v1.1.0-rc.3 mas não existe v1.1.0 -> cria v1.1.0).
          pending=""
          for base in $(git tag --list 'v*-rc.*' | sed -E 's/-rc\.[0-9]+$//' \
                          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu); do
            if ! git rev-parse -q --verify "refs/tags/$base" > /dev/null; then
              pending="$pending $base"
            fi
          done

          # shellcheck disable=SC2086
          set -- $pending
          if [ "$#" -eq 0 ]; then
            echo "::error::Nenhuma tag rc pendente de release. Crie a tag final manualmente."
            exit 1
          fi
          if [ "$#" -gt 1 ]; then
            echo "::warning::Há mais de uma versão com rc pendente ($pending ). Usando a mais recente."
          fi
          tag="${!#}"

          echo "Criando tag $tag a partir de $head_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${tag} (${head_branch})" "$GITHUB_SHA"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Baixar artefato
        if: steps.tag.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish

      - name: Criar release no GitHub
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG já existe. Nada a fazer."
            exit 0
          fi

          (cd publish && zip -qr "../happychat-api-${TAG}.zip" .)

          gh release create "$TAG" "happychat-api-${TAG}.zip" \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "$TAG"
