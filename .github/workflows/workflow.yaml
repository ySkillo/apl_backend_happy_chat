name: CI - Happy Chat Backend

on:
  push:
    branches: [main, homologation, development]
  pull_request:
    branches: [main, homologation, development]
  workflow_dispatch:

# Cancela execuções antigas da mesma branch/PR quando chega um commit novo
# (exceto na main, para nunca perder a criação da tag de release)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: HappyChat.sln
  API_PROJECT: src/HappyChat.API/HappyChat.API.csproj

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Ainda não há projetos de teste na solution; este passo passa a valer
      # automaticamente assim que você adicionar um (ex.: HappyChat.Tests).
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --verbosity normal

  publish:
    name: Publish artefato
    needs: build-and-test
    # Só gera artefato em push (não em PR)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish da API
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          --configuration Release
          --output ./publish

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: happychat-api-${{ github.ref_name }}-${{ github.sha }}
          path: ./publish
          retention-days: 7

  tag-homologation:
    name: Tag rc (homologation)
    # Só roda se o build e os testes passaram, e apenas em push na homologation
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/homologation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar e enviar tag rc
        env:
          # Tipo de incremento da versão base: major, minor ou patch (padrão: minor).
          # Para mudar: Settings > Secrets and variables > Actions > Variables > RC_BUMP
          BUMP: ${{ vars.RC_BUMP || 'minor' }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          # Se este commit já tem uma tag rc, não cria outra.
          if git tag --points-at HEAD | grep -qE -- '-rc\.[0-9]+$'; then
            echo "O commit já possui tag rc. Nada a fazer."
            exit 0
          fi

          # Última versão estável (vX.Y.Z, sem sufixo), criada na main.
          last_stable=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          if [ -z "$last_stable" ]; then
            base="0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${last_stable#v}"
            case "$BUMP" in
              major) base="$((major + 1)).0.0" ;;
              minor) base="${major}.$((minor + 1)).0" ;;
              patch) base="${major}.${minor}.$((patch + 1))" ;;
              *) echo "RC_BUMP inválido: $BUMP (use major, minor ou patch)"; exit 1 ;;
            esac
          fi

          # Próximo número de rc para essa versão base.
          last_rc=$(git tag --list "v${base}-rc.*" | sed -E 's/.*-rc\.//' | sort -n | tail -n1 || true)
          next_rc=$(( ${last_rc:-0} + 1 ))

          tag="v${base}-rc.${next_rc}"
          echo "Criando tag $tag"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" -m "Release candidate ${next_rc} da v${base}"
          git push origin "$tag"

  tag-release:
    name: Tag final (main)
    # Só roda se o build e os testes passaram, e apenas em push na main
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar e enviar tag final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          # Descobre o PR que gerou este commit na main.
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                 --jq '[.[] | select(.base.ref == "main")][0] // empty')

          if [ -z "$pr" ]; then
            echo "Commit sem Pull Request associado. Nada a fazer."
            exit 0
          fi

          head_branch=$(jq -r '.head.ref' <<< "$pr")

          # Só branches ReleaseDDMMAA geram tag final.
          if [[ ! "$head_branch" =~ ^Release[0-9]{6}$ ]]; then
            echo "Branch '$head_branch' não é uma Release. Nada a fazer."
            exit 0
          fi

          # Se este commit já tem tag final, não cria outra.
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "O commit já possui tag final. Nada a fazer."
            exit 0
          fi

          # Versão final = versão base das rcs ainda sem tag final
          # (ex.: existe v1.1.0-rc.3 mas não existe v1.1.0 -> cria v1.1.0).
          tag=""
          for base in $(git tag --list 'v*-rc.*' | sed -E 's/-rc\.[0-9]+$//' \
                          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu); do
            if ! git rev-parse -q --verify "refs/tags/$base" > /dev/null; then
              tag="$base"
            fi
          done

          if [ -z "$tag" ]; then
            echo "Nenhuma tag rc pendente de release. Crie a tag final manualmente."
            exit 1
          fi

          echo "Criando tag $tag a partir de $head_branch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" -m "Release ${tag} (${head_branch})" "$GITHUB_SHA"
          git push origin "$tag"
